[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motorcad-studio-mvp"
version = "0.88.1"
description = "Motor-CAD engineering optimization and simulation data factory platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
motorcad = ["ansys-motorcad-core==0.8.8"]
data = ["pandas>=2.2", "pyarrow>=16"]
dev = ["pytest>=8", "httpx>=0.27", "pytest-cov>=5"]
e2e = ["pytest>=8", "httpx>=0.27", "playwright>=1.45"]

[project.scripts]
motorcad-studio = "motorcad_studio.main:run"
motorcad-studio-windows-qualification = "motorcad_studio.acceptance.windows_production:main"
motorcad-studio-production-soak = "motorcad_studio.acceptance.production_soak:main"

[tool.setuptools.packages.find]
include = ["motorcad_studio*"]

[tool.setuptools.package-data]
motorcad_studio = ["static/*", "static/**/*", "config/*.yaml", "config/**/*.yaml", "seed_data/*.json", "seed_data/templates/*.mtt", "acceptance/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not e2e'"
norecursedirs = ["tests/history"]
markers = ["e2e: browser and workstation end-to-end tests"]
