[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motorcad-studio-mvp"
version = "0.69.0"
description = "Motor-CAD engineering optimization and simulation data factory platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
motorcad = ["ansys-motorcad-core==0.8.8"]
data = ["pandas>=2.2", "pyarrow>=16"]
dev = ["pytest>=8", "httpx>=0.27", "pytest-cov>=5"]

[project.scripts]
motorcad-studio = "motorcad_studio.main:run"

[tool.setuptools.packages.find]
include = ["motorcad_studio*"]

[tool.setuptools.package-data]
motorcad_studio = ["static/*"]
