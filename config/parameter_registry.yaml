parameters:
  pole_count:
    label: 极数
    description: 电机磁极总数，通常为偶数。
    motorcad_candidates: [Pole_Number]
    type: integer
    unit: ""
    minimum: 2
    maximum: 200
    category: topology
    level: basic
  slot_count:
    label: 槽数
    description: 定子槽总数。
    motorcad_candidates: [Slot_Number]
    type: integer
    unit: ""
    minimum: 1
    maximum: 300
    category: topology
    level: basic
  stator_outer_diameter:
    label: 定子外径
    motorcad_candidates: [Stator_Lam_Dia]
    type: number
    unit: mm
    minimum: 10
    maximum: 3000
    category: geometry
    level: basic
  stator_inner_diameter:
    label: 定子内径/定子孔径
    motorcad_candidates: [Stator_Bore]
    type: number
    unit: mm
    minimum: 0
    maximum: 2500
    category: geometry
    level: basic
  air_gap:
    label: 气隙
    motorcad_candidates: [Airgap, Air_Gap]
    type: number
    unit: mm
    minimum: 0.05
    maximum: 20
    category: geometry
    level: basic
  stator_lamination_length:
    label: 定子叠长
    motorcad_candidates: [Stator_Lam_Length, Stator_Lamination_Length]
    type: number
    unit: mm
    minimum: 1
    maximum: 3000
    category: geometry
    level: engineering
  tooth_width:
    label: 齿宽
    motorcad_candidates: [Tooth_Width]
    type: number
    unit: mm
    minimum: 0.1
    maximum: 500
    category: geometry
    level: engineering
  slot_depth:
    label: 槽深
    motorcad_candidates: [Slot_Depth]
    type: number
    unit: mm
    minimum: 0.1
    maximum: 500
    category: geometry
    level: engineering
  slot_opening:
    label: 槽口宽度
    description: 定子槽口宽度。与齿宽、槽深和定子内外径共同受几何约束；修改后必须通过Motor-CAD几何校验。
    motorcad_candidates: [Slot_Opening]
    type: number
    unit: mm
    minimum: 0.05
    maximum: 200
    category: geometry
    level: engineering
  magnet_thickness:
    label: 永磁体厚度
    motorcad_candidates: [Magnet_Thickness, Mag_Thickness]
    type: number
    unit: mm
    minimum: 0.1
    maximum: 100
    category: magnet
    level: engineering
  magnet_arc_deg:
    label: 永磁体极弧角
    motorcad_candidates: [Magnet_Arc, "Magnet_Arc_[ED]"]
    type: number
    unit: deg
    minimum: 1
    maximum: 180
    category: magnet
    level: engineering
  turns_per_coil:
    label: 每线圈匝数
    motorcad_candidates: [MagTurnsConductor, Turns_Per_Coil, Number_Of_Turns]
    type: integer
    unit: turn
    minimum: 1
    maximum: 10000
    category: winding
    level: engineering
  parallel_paths:
    label: 并联支路数
    motorcad_candidates: [ParallelPaths, Parallel_Paths]
    type: integer
    unit: ""
    minimum: 1
    maximum: 200
    category: winding
    level: engineering
  slot_fill_factor:
    label: 槽满率
    motorcad_candidates: [Slot_Fill, Slot_Fill_Factor]
    type: number
    unit: ratio
    minimum: 0.01
    maximum: 0.95
    category: winding
    level: engineering
  shaft_speed_rpm:
    label: 转速
    motorcad_candidates: ["Shaft_Speed_[RPM]", Shaft_Speed]
    type: number
    unit: rpm
    minimum: 0
    maximum: 300000
    category: operating
    level: basic
  peak_current_a:
    label: 峰值电流
    motorcad_candidates: [PeakCurrent, Peak_Current]
    type: number
    unit: A
    minimum: 0
    maximum: 10000
    category: operating
    level: basic
  rms_current_a:
    label: RMS电流
    motorcad_candidates: [RMSCurrent, RMS_Current]
    type: number
    unit: A
    minimum: 0
    maximum: 10000
    category: operating
    level: engineering
  dc_bus_voltage_v:
    label: 母线电压
    motorcad_candidates: [DCBusVoltage, DC_Bus_Voltage]
    type: number
    unit: V
    minimum: 0
    maximum: 5000
    default: 400
    category: operating
    level: basic
  phase_advance_deg:
    label: 电流超前角
    motorcad_candidates: [PhaseAdvance, Phase_Advance]
    type: number
    unit: deg
    minimum: -90
    maximum: 90
    default: 0
    category: operating
    level: basic
  ambient_temperature_c:
    label: 环境温度
    motorcad_candidates: [Ambient_Temperature, "Ambient_Temperature_[C]"]
    type: number
    unit: degC
    minimum: -60
    maximum: 250
    category: environment
    level: basic
  initial_temperature_c:
    label: 初始温度
    motorcad_candidates: [Initial_Temperature, "Initial_Temperature_[C]"]
    type: number
    unit: degC
    minimum: -60
    maximum: 250
    category: environment
    level: engineering
  coolant_inlet_temperature_c:
    label: 冷却液入口温度
    motorcad_candidates: [WJ_Fluid_Inlet_Temperature, Coolant_Inlet_Temperature]
    type: number
    unit: degC
    minimum: -60
    maximum: 250
    category: cooling
    level: engineering
  coolant_flow_rate_lpm:
    label: 冷却液流量
    motorcad_candidates: [WJ_Fluid_Volume_Flow_Rate, Coolant_Flow_Rate]
    type: number
    unit: L/min
    minimum: 0
    maximum: 10000
    category: cooling
    level: engineering
  external_air_speed_mps:
    label: 外部空气速度
    motorcad_candidates: [External_Fluid_Velocity, Air_Speed]
    type: number
    unit: m/s
    minimum: 0
    maximum: 250
    category: cooling
    level: engineering
