version: 1
objects:
  design: 电机方案
  design_revision: 设计版本
  scenario: 运行工况
  solver_profile: 计算设置
  output_profile: 结果设置
  run_configuration: 本次计算配置
  task: 计算记录
  case: 计算算例
  execution_lease: 执行技术信息
  validation_evidence: 模型检查证据
  worker: 计算进程
  session: Motor-CAD 会话
states:
  READY:
    label: 可以计算
    description: 当前电机、运行工况和本机 Motor-CAD 条件已经具备继续计算的基础条件。
  NEEDS_CHECK:
    label: 需要检查
    description: 当前配置还需要完成模型检查或补充必要信息。
  BLOCKED:
    label: 无法计算
    description: 当前存在必须先解决的问题。
  RUNNING:
    label: 计算中
    description: Motor-CAD 正在执行当前计算，请查看计算进度。
  COMPLETED:
    label: 已完成
    description: 已有计算结果，可以进入结果分析或继续修改设计。
issues:
  WINDING_REGEN_REQUIRED:
    title: 绕组需要重新检查
    reason: 槽数、极数、匝数或并联支路发生了变化，绕组排布也会随之改变。
    impact: 当前仍可继续配置，正式计算前会重新生成并检查绕组。
    action: 运行模型检查；如果检查失败，优先检查槽数、并联支路和绕组参数。
  DESIGN_REVISION_TASK_OVERRIDE:
    title: 本次计算临时修改了电机设计
    reason: 当前计算参数与保存的设计版本存在差异。
    impact: 这次结果只对应当前临时修改，后续无法直接把它当作已保存的设计版本。
    action: 如果这个修改需要长期保留，请返回“设计电机”并保存为新的设计版本。
  ANALYSIS_NOT_VERIFIED:
    title: 这项分析尚未在当前电脑完成过实机验证
    reason: 当前模板与分析类型还没有成功运行过完整的 Motor-CAD 验证计算。
    impact: 首次计算会执行完整检查，耗时可能更长。
    action: 可以继续首次验证；若失败，系统会给出具体的 Motor-CAD 原因。
  VERIFIED_MOT_MISSING:
    title: 当前使用 Motor-CAD 注册模板
    reason: 本地还没有生成经过验收的 MOT 母版。
    impact: 开发模式可以继续计算；验证或生产策略可能会阻止运行。
    action: 开发阶段可以继续；进入验证/生产阶段前生成并验收本地 MOT 母版。
  WINDING_SLOT_PHASE_PATH_NONINTEGER:
    title: 当前槽数无法形成有效三相绕组
    reason: 槽数不能按相数和并联支路整数分配。
    impact: Motor-CAD 无法生成可求解绕组，当前模型不能计算。
    action: 调整槽数或并联支路；优先恢复上一可行设计版本的槽数。
  MOTORCAD_WINDING_SLOT_FILL_OVER_ONE:
    title: 绕组槽满率过高
    reason: Motor-CAD 根据真实槽形和导体计算得到的槽满率超过 1.0。
    impact: 当前绕组无法放入定子槽，有限元计算不能继续。
    action: 优先检查每槽导体数、匝数、导体尺寸和槽面积。
  MOTORCAD_SLOT_OPENING_CONSTRAINT:
    title: 槽口尺寸与当前槽型不兼容
    reason: 当前槽口宽度与槽数、定子尺寸或槽型组合超出 Motor-CAD 允许范围。
    impact: 几何模型无法建立，当前模型不能计算。
    action: 检查槽口宽度、齿宽、槽深和槽数，或恢复上一可行设计版本。
  MOTORCAD_STATOR_AIR_INTERSECTION:
    title: 定子几何发生相交
    reason: Motor-CAD 检测到定子实体与定子空气区域重叠。
    impact: 几何模型无效，有限元网格无法可靠生成。
    action: 检查定子内径、槽深、齿宽、槽口和槽数。
  MOTORCAD_GEOMETRY_CHECK_FAILED:
    title: 电机几何没有通过 Motor-CAD 检查
    reason: 当前尺寸组合无法形成有效 Motor-CAD 几何。
    impact: 当前模型不能进入有限元求解。
    action: 根据下方具体几何原因定位参数；若信息不足，恢复上一可行设计版本后逐项修改。
