version: 1
# V0.70 separates Motor-CAD native type, physical family and topology.  Template IDs
# remain presets only and are resolved through motor_families.yaml unless overridden.
topologies:
  rfpm_spm:
    label: 径向内转子表贴式永磁电机
    native_motor_type: BPM
    family_id: rfpm
    views: [radial, longitudinal, winding, slot]
  rfpm_ipm:
    label: 径向内转子内置式永磁电机
    native_motor_type: BPM
    family_id: rfpm
    views: [radial, longitudinal, winding, slot]
  rfpm_spoke:
    label: 径向辐条式永磁电机
    native_motor_type: BPM
    family_id: rfpm
    views: [radial, longitudinal, winding, slot]
  afpm:
    label: 轴向磁通永磁电机
    native_motor_type: BPM
    family_id: afpm
    views: [axial, longitudinal, winding, slot]
  outer_rotor_pm:
    label: 外转子永磁电机
    native_motor_type: BPMOR
    family_id: rfpm
    views: [radial, longitudinal, winding, slot]
  induction:
    label: 三相感应电机
    native_motor_type: IM
    family_id: induction
    views: [radial, longitudinal, winding, slot]
  induction_1ph:
    label: 单相感应电机
    native_motor_type: IM1PH
    family_id: induction
    views: [radial, longitudinal, winding, slot]
  synchronous_wound:
    label: 绕线同步电机
    native_motor_type: SYNC
    family_id: synchronous
    views: [radial, longitudinal, winding, slot]
  synchronous_reluctance:
    label: 同步磁阻电机
    native_motor_type: SYNCREL
    family_id: reluctance
    views: [radial, longitudinal, winding, slot]
  switched_reluctance:
    label: 开关磁阻电机
    native_motor_type: SRM
    family_id: reluctance
    views: [radial, longitudinal, winding, slot]
  pmdc:
    label: 永磁直流电机
    native_motor_type: PMDC
    family_id: pmdc
    views: [radial, longitudinal, winding]
  claw_thermal:
    label: 爪极热模型
    native_motor_type: CLAW
    family_id: claw
    views: [longitudinal]
  coreless_cup:
    label: 空心杯/无铁心电机
    native_motor_type: BPM
    family_id: coreless
    views: [radial, longitudinal]

template_overrides:
  e14_eMobility_AFM: afpm
  a4: afpm
  r2: afpm
