version: 1
severity_order: [BLOCKING, WARNING, INFO]
categories:
  geometry: {label: 几何关系, order: 1}
  winding: {label: 绕组可制造性, order: 2}
  input: {label: 输入完整性, order: 3}
  operating: {label: 运行工况, order: 4}
  thermal: {label: 热边界与流动, order: 5}
  materials: {label: 材料完整性, order: 6}
  solver: {label: 求解设置, order: 7}
rules:
  - {id: INPUT_DOMAIN_CONFIRMATION_REQUIRED, category: input, severity: BLOCKING, label: 本分析需要的输入模块必须确认, fields: [cooling, losses, materials]}
  - {id: GEOM_POSITIVE_LENGTH, category: geometry, severity: BLOCKING, label: 有效长度必须大于零, fields: [stator_length, motor_length, axial_length]}
  - {id: GEOM_SHAFT_INSIDE_ROTOR, category: geometry, severity: BLOCKING, label: 转轴必须位于转子内部, fields: [shaft_diameter, rotor_diameter]}
  - {id: GEOM_ROTOR_INSIDE_BORE, category: geometry, severity: BLOCKING, label: 转子外径必须小于定子内径, fields: [rotor_diameter, stator_bore]}
  - {id: GEOM_AIRGAP_CONSISTENT, category: geometry, severity: BLOCKING, label: 直径差必须容纳双边气隙, fields: [rotor_diameter, stator_bore, airgap]}
  - {id: GEOM_MAGNET_FITS_ROTOR, category: geometry, severity: BLOCKING, label: 磁钢厚度必须适合转子径向空间, fields: [magnet_thickness, rotor_diameter, shaft_diameter]}
  - {id: GEOM_SLOT_DEPTH_FITS_YOKE, category: geometry, severity: BLOCKING, label: 槽深必须小于定子径向厚度, fields: [slot_depth, stator_outer_diameter, stator_bore]}
  - {id: GEOM_SLOT_OPENING_FITS_PITCH, category: geometry, severity: BLOCKING, label: 槽口必须小于槽距, fields: [slot_opening, slot_number, stator_bore]}
  - {id: WINDING_PHASE_COUNT, category: winding, severity: BLOCKING, label: 相数必须为正整数, fields: [phase_count]}
  - {id: WINDING_PARALLEL_PATHS, category: winding, severity: BLOCKING, label: 并联支路必须为正整数, fields: [parallel_paths]}
  - {id: WINDING_TURNS_POSITIVE, category: winding, severity: BLOCKING, label: 每线圈匝数必须大于零, fields: [turns_per_coil, MagTurnsConductor]}
  - {id: WINDING_SLOT_FILL_RANGE, category: winding, severity: BLOCKING, label: 槽满率必须在 0 到 1 之间, fields: [slot_fill]}
  - {id: WINDING_SLOT_FILL_HIGH, category: winding, severity: WARNING, label: 高槽满率需要工艺确认, fields: [slot_fill]}
  - {id: WINDING_EVEN_POLES, category: winding, severity: WARNING, label: 常规旋转电机极数通常为偶数, fields: [pole_number]}
  - {id: OPERATING_SPEED_NONNEGATIVE, category: operating, severity: BLOCKING, label: 转速不可为负, fields: [shaft_speed_rpm]}
  - {id: OPERATING_CURRENT_NONNEGATIVE, category: operating, severity: BLOCKING, label: 电流不可为负, fields: [peak_current_a, current_a]}
  - {id: OPERATING_VOLTAGE_POSITIVE, category: operating, severity: WARNING, label: 带载电磁计算需要正母线电压, fields: [dc_bus_voltage_v]}
  - {id: THERMAL_ABSOLUTE_TEMPERATURE, category: thermal, severity: BLOCKING, label: 温度不可低于绝对零度, fields: [ambient_temperature_c, coolant_inlet_temperature_c, radiation_temperature_c]}
  - {id: THERMAL_LIQUID_FLOW_REQUIRED, category: thermal, severity: BLOCKING, label: 液冷方式需要正流量, fields: [cooling_type, coolant_flow_rate_lpm]}
  - {id: THERMAL_FORCED_AIR_SPEED_REQUIRED, category: thermal, severity: BLOCKING, label: 强迫风冷需要正空气速度, fields: [cooling_type, external_air_speed_mps]}
  - {id: THERMAL_EMISSIVITY_RANGE, category: thermal, severity: BLOCKING, label: 发射率必须在 0 到 1 之间, fields: [emissivity]}
  - {id: THERMAL_FLOW_PRESSURE_NONNEGATIVE, category: thermal, severity: BLOCKING, label: 流量与压降不可为负, fields: [volume_flow_rate_lpm, pressure_drop_pa]}
  - {id: MATERIAL_REQUIRED_ASSIGNMENTS, category: materials, severity: BLOCKING, label: 关键部件必须指定材料, fields: [stator_material, rotor_material, conductor_material, housing_material]}
  - {id: MATERIAL_COOLANT_MATCH, category: materials, severity: WARNING, label: 冷却页与材料页介质应一致, fields: [fluid, coolant_fluid]}
  - {id: THERMAL_FLOW_INPUT_MISMATCH, category: thermal, severity: WARNING, label: 冷却页与流动回路的体积流量应一致, fields: [coolant_flow_rate_lpm, volume_flow_rate_lpm]}
  - {id: SOLVER_TRANSIENT_STEP_POSITIVE, category: solver, severity: BLOCKING, label: 瞬态时间步必须大于零, fields: [Transient_Time_Step, transient_time_step]}
  - {id: SOLVER_TRANSIENT_STEP_LT_DURATION, category: solver, severity: BLOCKING, label: 瞬态时间步必须小于总时长, fields: [Transient_Time_Step, Transient_Time_Period]}
  - {id: SOLVER_ELECTRICAL_RESOLUTION, category: solver, severity: WARNING, label: 每电周期点数过低会影响波形精度, fields: [TorquePointsPerCycle]}
  - {id: SOLVER_MECHANICAL_MESH_POSITIVE, category: solver, severity: BLOCKING, label: 机械网格尺寸必须大于零, fields: [mechanical_mesh_size]}
