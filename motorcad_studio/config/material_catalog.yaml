version: 2026-08
notes:
  zh: >-
    内置目录用于快速选型和常用牌号检索。磁体/电工钢的精确BH、退磁、损耗及温度曲线仍以供应商数据和实际Motor-CAD材料数据库为准；同名牌号在不同供应商之间可能存在差异。
  en: >-
    The built-in catalog is intended for rapid engineering selection. Exact B-H, demagnetization, loss and temperature-dependent curves must still come from the supplier and the active Motor-CAD materials database; nominally identical grades can differ by supplier.
sources:
  - id: tdk_neorec
    title: TDK NEOREC neodymium magnet catalog
    url: https://product.tdk.com/en/search/magnet/magnet/neodymium/catalog
  - id: arnold_ndfeb
    title: Arnold Magnetic Technologies NdFeB grades
    url: https://www.arnoldmagnetics.com/products/neodymium-iron-boron-magnets/
  - id: thyssenkrupp_powercore
    title: thyssenkrupp powercore A non-grain-oriented electrical steel
    url: https://www.thyssenkrupp-steel.com/en/products/electrical-steel/electrical-steel-non-grain-oriented/powercore-a/powercore-a.html
