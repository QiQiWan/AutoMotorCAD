version: stable-docs-2026-08
source: https://motorcad.docs.pyansys.com/version/stable/examples/
contexts:
  EMag:
    - id: current_definition
      automation_name: CurrentDefinition
      label: 电流定义
      type: enum
      default: 0
      options:
        - {value: 0, label: Peak}
      group: operating_point
      description: 官方 EMag 基础示例使用 0 表示 Peak 电流定义。
    - id: torque_points_per_cycle
      automation_name: TorquePointsPerCycle
      label: 每电周期转矩计算点数
      type: integer
      default: 30
      minimum: 1
      group: torque
    - id: torque_number_cycles
      automation_name: TorqueNumberCycles
      label: 转矩计算电周期数
      type: integer
      default: 1
      minimum: 1
      group: torque
    - id: torque_calculation
      automation_name: TorqueCalculation
      label: 瞬态转矩计算
      type: boolean
      default: true
      group: calculations
    - id: back_emf_calculation
      automation_name: BackEMFCalculation
      label: 反电动势计算
      type: boolean
      default: false
      group: calculations
    - id: cogging_torque_calculation
      automation_name: CoggingTorqueCalculation
      label: 齿槽转矩计算
      type: boolean
      default: false
      group: calculations
    - id: torque_speed_calculation
      automation_name: TorqueSpeedCalculation
      label: 转矩-转速计算
      type: boolean
      default: false
      group: calculations
    - id: demagnetization_calculation
      automation_name: DemagnetizationCalc
      label: 退磁计算
      type: boolean
      default: false
      group: calculations
    - id: inductance_calculation
      automation_name: InductanceCalc
      label: 电感计算
      type: boolean
      default: false
      group: calculations
    - id: short_circuit_calculation
      automation_name: BPMShortCircuitCalc
      label: BPM短路计算
      type: boolean
      default: false
      group: calculations
    - id: electromagnetic_forces_open_circuit
      automation_name: ElectromagneticForcesCalc_OC
      label: 开路电磁力计算
      type: boolean
      default: false
      group: calculations
    - id: electromagnetic_forces_load
      automation_name: ElectromagneticForcesCalc_Load
      label: 负载电磁力计算
      type: boolean
      default: false
      group: calculations
  Therm:
    - id: transient_calculation_type
      automation_name: Transient_Calculation_Type
      label: 瞬态计算类型
      type: integer
      default: 0
      group: transient
    - id: transient_time_period
      automation_name: Transient_Time_Period
      label: 瞬态计算时长
      type: number
      unit: s
      default: 60
      minimum: 0
      group: transient
    - id: transient_time_step
      automation_name: Transient_Time_Step
      label: 瞬态时间步长
      type: number
      unit: s
      default: 1
      minimum: 0.001
      group: transient
    - id: thermal_model_size
      automation_name: ThermalModelSize
      label: 热网络模型规模
      type: enum
      default: 0
      options:
        - {value: 0, label: Full model}
        - {value: 1, label: Reduced node model}
      group: model
    - id: thermal_model_type
      automation_name: ThermalModelType
      label: 热模型维度
      type: enum
      default: 0
      options:
        - {value: 0, label: 3D model}
        - {value: 1, label: 2D FEA calibration}
      group: model
    - id: loss_source
      automation_name: LossSource
      label: 损耗来源
      type: enum
      default: 0
      options:
        - {value: 0, label: Steady-state loss}
        - {value: 1, label: Speed variation table}
        - {value: 2, label: Imported loss map}
      group: coupling
    - id: thermal_coupling_mode
      automation_name: ThermalCouplingMode
      label: 电磁—热耦合方式
      type: enum
      default: 0
      options:
        - {value: 0, label: No coupling}
        - {value: 1, label: E-Magnetic losses to Thermal}
        - {value: 2, label: Thermal temperatures to E-Magnetic}
        - {value: 3, label: Iterate to converged solution}
      group: coupling
    - id: thermal_convergence_tolerance
      automation_name: ThermalConvergenceTolerance
      label: 热耦合收敛容差
      type: number
      unit: °C
      default: 0.5
      minimum: 0.01
      group: convergence
  Lab:
    - id: model_type_motorlab
      automation_name: ModelType_MotorLAB
      label: Lab模型类型
      type: integer
      default: 1
      group: model_build
    - id: saturation_model_points
      automation_name: SatModelPoints_MotorLAB
      label: 饱和模型点设置
      type: integer
      default: 0
      group: model_build
    - id: loss_model_lab
      automation_name: LossModel_Lab
      label: Lab损耗模型
      type: integer
      default: 0
      group: model_build
    - id: model_build_speed
      automation_name: ModelBuildSpeed_MotorLAB
      label: Lab模型构建最高转速
      type: number
      unit: rpm
      default: 10000
      group: model_build
    - id: max_model_current
      automation_name: MaxModelCurrent_MotorLAB
      label: Lab模型最大电流
      type: number
      unit: A
      default: 480
      group: model_build
    - id: build_saturation_model
      automation_name: BuildSatModel_MotorLAB
      label: 构建饱和模型
      type: boolean
      default: true
      group: model_build
    - id: operating_mode_lab
      automation_name: OperatingMode_Lab
      label: Lab运行模式
      type: integer
      default: 0
      group: calculation
    - id: operating_point_spec
      automation_name: OpPointSpec_MotorLAB
      label: Lab工作点定义
      type: integer
      default: 1
      group: operating_point
    - id: stator_current_demand_lab
      automation_name: StatorCurrentDemand_Lab
      label: Lab定子电流需求
      type: number
      unit: A
      default: 480
      group: operating_point
    - id: speed_demand_motorlab
      automation_name: SpeedDemand_MotorLAB
      label: Lab转速需求
      type: number
      unit: rpm
      default: 4000
      group: operating_point
    - id: lab_thermal_coupling
      automation_name: LabThermalCoupling
      label: Lab热耦合开关
      type: boolean
      default: false
      group: coupling
    - id: lab_magnetic_coupling
      automation_name: LabMagneticCoupling
      label: Lab磁耦合开关
      type: boolean
      default: false
      group: coupling
  Mechanical:
    - id: shaft_speed
      automation_name: ShaftSpeed
      label: 机械校核转速
      type: number
      unit: rpm
      default: 12000
      minimum: 0
      group: operating_point
    - id: mechanical_include_magnets
      automation_name: MechanicalIncludeMagnets
      label: 应力模型包含磁钢
      type: boolean
      default: true
      group: model
    - id: mechanical_include_rotor_bars
      automation_name: MechanicalIncludeRotorBars
      label: 应力模型包含转子导条
      type: boolean
      default: true
      group: model
    - id: mechanical_adhesion_factor
      automation_name: MechanicalAdhesionFactor
      label: 磁钢粘接系数
      type: number
      default: 1.0
      minimum: 0
      maximum: 1
      group: material
    - id: mechanical_mesh_size
      automation_name: MechanicalMeshSize
      label: 机械网格尺寸
      type: number
      unit: mm
      default: 1.0
      minimum: 0.05
      group: mesh
    - id: force_export_enabled
      automation_name: ForceExportEnabled
      label: 导出电磁力时空阶次
      type: boolean
      default: true
      group: nvh
    - id: nvh_max_order
      automation_name: NVHMaxOrder
      label: NVH 最大阶次
      type: integer
      default: 48
      minimum: 1
      group: nvh
