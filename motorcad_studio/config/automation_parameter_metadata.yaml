version: 1
source_policy: >-
  Entries in this file are manually reviewed operator-facing metadata. Automation
  parameters not listed here remain visible only as unreviewed native parameters.
parameters:
  TorquePointsPerCycle:
    label_zh: 每电周期转矩采样点数
    label_en: Torque points per cycle
    description_zh: 控制一个电周期内转矩波形的采样点数。增加该值通常提高波形与谐波分辨率，同时增加求解时间。
    category: solver_resolution
    risk: medium
    source: pymotorcad_emag_basics
    reviewed: true
  TorqueNumberCycles:
    label_zh: 转矩计算电周期数
    label_en: Torque calculation cycles
    description_zh: 控制瞬态转矩计算覆盖的电周期数量。模板默认值通常适合常规计算，增加周期数会增加求解时间。
    category: solver_resolution
    risk: medium
    source: pymotorcad_emag_basics
    reviewed: true
  TorqueCalculation:
    label_zh: 瞬态转矩计算
    label_en: Torque calculation
    description_zh: 启用或关闭瞬态转矩计算。需要转矩波形、转矩脉动或转矩谐波时通常需要启用。
    category: calculation_switch
    risk: low
    source: pymotorcad_emag_basics
    reviewed: true
  BackEMFCalculation:
    label_zh: 反电动势计算
    label_en: Back-EMF calculation
    description_zh: 启用反电动势计算，用于获取反电动势波形及相关谐波结果。
    category: calculation_switch
    risk: low
    source: pymotorcad_emag_basics
    reviewed: true
  CoggingTorqueCalculation:
    label_zh: 齿槽转矩计算
    label_en: Cogging torque calculation
    description_zh: 启用齿槽转矩计算。通常用于转矩脉动与NVH相关设计研究。
    category: calculation_switch
    risk: low
    source: pymotorcad_emag_basics
    reviewed: true
  TorqueSpeedCalculation:
    label_zh: 转矩-转速计算
    label_en: Torque-speed calculation
    description_zh: 启用Motor-CAD转矩-转速相关计算。正式包络和效率图建议配合Lab工作流使用。
    category: calculation_switch
    risk: medium
    source: pymotorcad_emag_basics
    reviewed: true
  DemagnetizationCalc:
    label_zh: 永磁体退磁计算
    label_en: Demagnetization calculation
    description_zh: 启用永磁体退磁相关计算。结果应结合实际磁钢退磁曲线和工作温度判断。
    category: calculation_switch
    risk: medium
    source: pymotorcad_emag_basics
    reviewed: true
  InductanceCalc:
    label_zh: 电感计算
    label_en: Inductance calculation
    description_zh: 启用电感相关计算，可用于Ld/Lq及控制参数分析。
    category: calculation_switch
    risk: low
    source: pymotorcad_emag_basics
    reviewed: true
  BPMShortCircuitCalc:
    label_zh: BPM短路计算
    label_en: BPM short-circuit calculation
    description_zh: 启用永磁电机短路工况计算。属于异常工况分析，建议在明确分析目的时使用。
    category: calculation_switch
    risk: high
    source: pymotorcad_emag_basics
    reviewed: true
  ElectromagneticForcesCalc_OC:
    label_zh: 开路电磁力计算
    label_en: Open-circuit electromagnetic forces
    description_zh: 计算开路状态下的电磁力，可用于力谐波和NVH后处理。
    category: force_nvh
    risk: medium
    source: pymotorcad_emag_basics
    reviewed: true
  ElectromagneticForcesCalc_Load:
    label_zh: 负载电磁力计算
    label_en: Loaded electromagnetic forces
    description_zh: 计算负载状态下的电磁力，可用于力谐波和NVH后处理。
    category: force_nvh
    risk: medium
    source: pymotorcad_emag_basics
    reviewed: true
  Transient_Calculation_Type:
    label_zh: 瞬态热计算类型
    label_en: Transient thermal calculation type
    description_zh: Motor-CAD热瞬态求解类型控制。通常沿用模板或经过验证的分析Recipe设置。
    category: thermal_solver
    risk: high
    source: pymotorcad_thermal_basics
    reviewed: true
  Transient_Time_Period:
    label_zh: 瞬态热计算时长
    label_en: Transient thermal duration
    description_zh: 设置热瞬态分析的计算时间范围，单位以Motor-CAD Automation Parameter Names为准。
    category: thermal_solver
    risk: medium
    source: pymotorcad_thermal_basics
    reviewed: true
  ModelBuildSpeed_MotorLAB:
    label_zh: Lab模型构建最高转速
    label_en: Lab model build speed
    description_zh: Motor-CAD Lab模型构建时覆盖的最高转速。应覆盖目标运行包络，同时避免无意义扩大模型范围。
    category: lab_model_build
    risk: medium
    source: pymotorcad_lab_basics
    reviewed: true
  MaxModelCurrent_MotorLAB:
    label_zh: Lab模型最大电流
    label_en: Lab maximum model current
    description_zh: Motor-CAD Lab模型构建的最大电流范围，应覆盖预期峰值工作点。
    category: lab_model_build
    risk: medium
    source: pymotorcad_lab_basics
    reviewed: true
  SpeedDemand_MotorLAB:
    label_zh: Lab工作点转速
    label_en: Lab speed demand
    description_zh: Motor-CAD Lab工作点计算的目标转速。
    category: lab_operating_point
    risk: low
    source: pymotorcad_lab_basics
    reviewed: true
  StatorCurrentDemand_Lab:
    label_zh: Lab定子电流需求
    label_en: Lab stator current demand
    description_zh: Motor-CAD Lab工作点使用的定子电流需求值。
    category: lab_operating_point
    risk: low
    source: pymotorcad_lab_basics
    reviewed: true
