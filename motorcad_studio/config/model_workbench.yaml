  rotor_diameter:
    component: 内转子包络
    region_ids: [rotor, airgap]
    affects: [转子外圆, 气隙包含关系, 磁体位置]
    related: [air_gap, stator_inner_diameter, magnet_thickness]
  rotor_outer_diameter:
    component: 外转子外包络
    region_ids: [rotor, magnet, airgap]
    affects: [外转子铁心包络, 内表面磁体位置, 定转子包含关系]
    related: [stator_outer_diameter, air_gap, magnet_thickness]
  axial_rotor_diameter:
    component: 轴向转子盘
    region_ids: [rotor, magnet]
    affects: [转子盘端面, 磁极环带, 轴向堆叠投影]
    related: [stator_outer_diameter, stator_inner_diameter, shaft_diameter]
  magnet_width:
    component: IPM 永磁体
    region_ids: [magnet, rotor]
    affects: [V 型磁体长度, 转子桥/磁障空间]
    related: [magnet_thickness, pole_v_angle_deg, magnet_embed_depth]
  magnet_embed_depth:
    component: IPM 永磁体
    region_ids: [magnet, rotor]
    affects: [磁体径向位置, 转子桥厚度]
    related: [magnet_width, magnet_thickness, rotor_diameter]
  pole_v_angle_deg:
    component: IPM V 型磁体
    region_ids: [magnet, rotor]
    affects: [V 型开口角, 磁障拓扑]
    related: [magnet_width, magnet_embed_depth, magnet_separation]
  magnet_separation:
    component: IPM 永磁体
    region_ids: [magnet, rotor]
    affects: [同极磁体间距, 中心桥区域]
    related: [pole_v_angle_deg, magnet_width]
  magnet_layers:
    component: IPM 永磁体层
    region_ids: [magnet, rotor]
    affects: [V 型磁体层数, 转子磁路拓扑]
    related: [magnet_width, magnet_thickness]
