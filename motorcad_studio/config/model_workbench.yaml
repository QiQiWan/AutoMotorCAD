version: 1
category_order:
- topology
- geometry
- magnet
- winding
category_labels:
  topology: 拓扑
  geometry: 几何
  magnet: 永磁体
  winding: 绕组
regions:
  stator:
    label: 定子
    parameter_ids:
    - stator_outer_diameter
    - stator_inner_diameter
    - stator_lamination_length
    - housing_diameter
  stator-slot:
    label: 定子槽
    parameter_ids:
    - slot_count
    - tooth_width
    - slot_depth
    - slot_opening
    - slot_width
    - slot_corner_radius
    - tooth_tip_depth
    - tooth_tip_angle
  airgap:
    label: 气隙
    parameter_ids:
    - air_gap
    - stator_inner_diameter
    - magnet_thickness
    - sleeve_thickness
    - banding_thickness
  rotor:
    label: 转子
    parameter_ids:
    - pole_count
    - magnet_thickness
    - magnet_arc_deg
    - rotor_lamination_length
    - shaft_diameter
    - shaft_hole_diameter
    - sleeve_thickness
    - banding_thickness
    - magnet_length
    - rotor_diameter
    - rotor_outer_diameter
    - axial_rotor_diameter
    - magnet_width
    - magnet_embed_depth
    - pole_v_angle_deg
    - magnet_separation
    - magnet_layers
  magnet:
    label: 永磁体
    parameter_ids:
    - pole_count
    - magnet_thickness
    - magnet_arc_deg
    - magnet_length
    - magnet_width
    - magnet_embed_depth
    - pole_v_angle_deg
    - magnet_separation
    - magnet_layers
  winding:
    label: 绕组
    parameter_ids:
    - slot_count
    - pole_count
    - turns_per_coil
    - parallel_paths
    - slot_fill_factor
  housing:
    label: 机壳
    parameter_ids:
    - housing_diameter
  shaft:
    label: 转轴
    parameter_ids:
    - shaft_diameter
    - shaft_hole_diameter
parameter_dependencies:
  pole_count:
    component: 转子磁极 / 绕组周期
    region_ids:
    - rotor
    - magnet
    - winding
    affects:
    - 磁极节距
    - 永磁体排布
    - 绕组周期
    - 基波绕组因数
    related:
    - slot_count
    - magnet_arc_deg
    - turns_per_coil
  slot_count:
    component: 定子槽 / 绕组
    region_ids:
    - stator-slot
    - winding
    affects:
    - 槽距
    - 齿宽与槽宽关系
    - 绕组分配
    - 每相每支路槽数
    - 槽满率
    - 绕组因数
    related:
    - pole_count
    - tooth_width
    - slot_depth
    - slot_opening
    - parallel_paths
    - turns_per_coil
    - slot_fill_factor
  stator_outer_diameter:
    component: 定子外圆
    region_ids:
    - stator
    affects:
    - 定子径向厚度
    - 槽可用空间
    - 热路径
    related:
    - stator_inner_diameter
    - slot_depth
    - tooth_width
    - housing_diameter
  stator_inner_diameter:
    component: 定子孔径 / 气隙侧
    region_ids:
    - stator
    - airgap
    - stator-slot
    affects:
    - 槽距
    - 定子径向厚度
    - 气隙侧圆周长度
    related:
    - stator_outer_diameter
    - slot_count
    - tooth_width
    - slot_opening
    - air_gap
    - shaft_diameter
  air_gap:
    component: 定转子气隙
    region_ids:
    - airgap
    affects:
    - 磁路磁阻
    - 反电势
    - 转矩
    - FEA 网格敏感性
    related:
    - stator_inner_diameter
    - magnet_thickness
  stator_lamination_length:
    component: 定子叠长
    region_ids:
    - stator
    affects:
    - 有效电磁长度
    - 转矩能力
    - 铜耗与铁耗尺度
    related:
    - stator_outer_diameter
    - tooth_width
    - rotor_lamination_length
    - magnet_length
  tooth_width:
    component: 定子齿
    region_ids:
    - stator-slot
    - stator
    affects:
    - 槽宽
    - 齿磁密
    - 槽面积
    - 槽满率
    related:
    - slot_count
    - stator_inner_diameter
    - slot_opening
    - slot_depth
    - slot_fill_factor
    - slot_width
    - tooth_tip_depth
  slot_depth:
    component: 定子槽
    region_ids:
    - stator-slot
    affects:
    - 槽面积
    - 定子轭厚
    - 槽满率
    related:
    - stator_outer_diameter
    - stator_inner_diameter
    - tooth_width
    - slot_fill_factor
    - slot_width
    - slot_corner_radius
  slot_opening:
    component: 槽口
    region_ids:
    - stator-slot
    affects:
    - 齿顶几何
    - 槽口漏磁
    - 区域相交风险
    related:
    - slot_count
    - tooth_width
    - stator_inner_diameter
    - tooth_tip_depth
    - tooth_tip_angle
    - slot_width
  magnet_thickness:
    component: 永磁体
    region_ids:
    - magnet
    - rotor
    - airgap
    affects:
    - 气隙磁密
    - 转子外形
    - 磁钢体积
    related:
    - air_gap
    - magnet_arc_deg
    - pole_count
    - magnet_length
    - sleeve_thickness
    - banding_thickness
  magnet_arc_deg:
    component: 永磁体极弧
    region_ids:
    - magnet
    - rotor
    affects:
    - 极弧系数
    - 气隙磁密波形
    - 转矩脉动
    related:
    - pole_count
    - magnet_thickness
  turns_per_coil:
    component: 绕组匝数
    region_ids:
    - winding
    - stator-slot
    affects:
    - 反电势
    - 电流密度
    - 导体占用
    - 槽满率
    related:
    - slot_count
    - parallel_paths
    - slot_fill_factor
    - slot_width
  parallel_paths:
    component: 并联支路
    region_ids:
    - winding
    affects:
    - 每相每支路槽数
    - 支路电流
    - 绕组可行性
    related:
    - slot_count
    - turns_per_coil
  slot_fill_factor:
    component: 槽内导体占用
    region_ids:
    - winding
    - stator-slot
    affects:
    - 可制造性
    - 铜耗
    - 绕组温升
    related:
    - slot_count
    - tooth_width
    - slot_depth
    - turns_per_coil
    - slot_width
  housing_diameter:
    component: 机壳
    region_ids:
    - housing
    - stator
    affects:
    - 机壳径向空间
    - 外部冷却边界
    - 装配包络
    related:
    - stator_outer_diameter
  shaft_diameter:
    component: 转轴
    region_ids:
    - shaft
    - rotor
    affects:
    - 轴强度
    - 转子内孔
    - 轴承与装配关系
    related:
    - shaft_hole_diameter
    - stator_inner_diameter
  shaft_hole_diameter:
    component: 轴孔
    region_ids:
    - shaft
    affects:
    - 转轴有效截面
    - 中空轴装配
    related:
    - shaft_diameter
  rotor_lamination_length:
    component: 转子叠长
    region_ids:
    - rotor
    affects:
    - 转子有效电磁长度
    - 磁体轴向覆盖
    - 端部装配
    related:
    - stator_lamination_length
    - magnet_length
  slot_width:
    component: 定子槽
    region_ids:
    - stator-slot
    affects:
    - 槽面积
    - 齿宽关系
    - 槽满率
    related:
    - tooth_width
    - slot_depth
    - slot_opening
  slot_corner_radius:
    component: 槽底圆角
    region_ids:
    - stator-slot
    affects:
    - 槽面积
    - 局部机械/制造圆角
    related:
    - slot_width
    - slot_depth
  tooth_tip_depth:
    component: 齿顶
    region_ids:
    - stator-slot
    affects:
    - 槽口磁导
    - 槽楔/槽口空间
    related:
    - slot_opening
    - tooth_tip_angle
  tooth_tip_angle:
    component: 齿顶
    region_ids:
    - stator-slot
    affects:
    - 齿顶几何
    - 槽口边界
    related:
    - slot_opening
    - tooth_tip_depth
  sleeve_thickness:
    component: 转子套筒
    region_ids:
    - rotor
    - airgap
    affects:
    - 有效气隙
    - 转子包络
    - 机械约束
    related:
    - air_gap
    - magnet_thickness
    - banding_thickness
  banding_thickness:
    component: 转子绑带
    region_ids:
    - rotor
    - airgap
    affects:
    - 有效气隙
    - 转子包络
    related:
    - air_gap
    - magnet_thickness
    - sleeve_thickness
  magnet_length:
    component: 永磁体
    region_ids:
    - magnet
    - rotor
    affects:
    - 永磁体轴向覆盖
    - 磁钢体积
    - 端部漏磁
    related:
    - stator_lamination_length
    - rotor_lamination_length
    - magnet_thickness
