version: 1
navigation:
  - id: geometry
    label: Geometry
    label_zh: 几何
    route: workspace
    design_view: radial
    description: 径向、轴向、比例及自适应几何参数化。
  - id: winding
    label: Winding
    label_zh: 绕组
    route: workspace
    design_view: winding
    description: Pattern、Definition、Positions 与绕组可行性。
  - id: input_data
    label: Input Data
    label_zh: 输入数据
    route: newTask
    description: 损耗、材料、冷却、界面、辐射、对流和流动回路。
  - id: calculation
    label: Calculation
    label_zh: 计算
    route: analysisWorkbench
    description: 选择分析上下文、专用配方、耦合方式和求解控制。
  - id: temperatures
    label: Temperatures
    label_zh: 温度
    route: resultViewer
    viewer_module: thermal_schematic
    description: 热网络、径向/轴向温度、热流和瞬态温升。
  - id: output_data
    label: Output Data
    label_zh: 输出数据
    route: resultViewer
    viewer_module: output_data
    description: 按物理域组织的数值结果、单位、质量和来源。
  - id: graphs
    label: Graphs
    label_zh: 图表
    route: resultViewer
    viewer_module: graphs
    description: 电磁波形、谐波、热瞬态、性能图和机械响应。
  - id: sensitivity
    label: Sensitivity
    label_zh: 敏感性
    route: newTask
    description: Sweep、DOE、多目标优化、约束和计算量估算。
input_domains:
  cooling:
    label: Cooling
    label_zh: 冷却
    controls: [cooling_type, coolant_inlet_temperature_c, coolant_flow_rate_lpm, external_air_speed_mps]
    variants: [natural_convection, forced_air, water_jacket, oil_spray, wet_rotor, immersion]
  losses:
    label: Losses
    label_zh: 损耗
    controls: [loss_source, copper_loss_temperature_model, loss_speed_table]
  materials:
    label: Materials
    label_zh: 材料
    controls: [component_materials, cooling_fluids, material_database_path]
  interfaces:
    label: Interfaces
    label_zh: 界面
    controls: [contact_resistance_model, interface_gap_multiplier, bearing_model]
  radiation:
    label: Radiation
    label_zh: 辐射
    controls: [radiation_enabled, radiation_temperature_c, emissivity_model]
  convection:
    label: Convection
    label_zh: 对流
    controls: [convection_model, altitude_m, external_air_speed_mps]
  end_space:
    label: End Space
    label_zh: 端部空间
    controls: [endspace_correlation, endcap_vents, rotational_effects]
  flow_circuit:
    label: Flow Circuit
    label_zh: 流动回路
    controls: [fluid, inlet_temperature_c, mass_flow_rate, pressure_drop, flow_direction]
    semantics: physical_cooling_flow_network

winding_pages:
  pattern:
    label: Pattern
    capabilities: [phase_slot_assignment, coil_pitch, parallel_paths, add_remove_coil, copy_phase]
  definition:
    label: Definition
    capabilities: [coil_style, wire_size, conductor_count, slot_fill, liner, wedge, divider]
  positions:
    label: Positions
    capabilities: [strand_positions, hairpin_layers, conductor_spacing]
  diagnostics:
    label: Diagnostics
    capabilities: [phasor, mmf, harmonics, winding_factor, feasibility]

evidence_levels:
  - {id: DECLARED, rank: 1, label_zh: 已声明}
  - {id: CALLABLE, rank: 2, label_zh: API 可调用}
  - {id: CONFIGURABLE, rank: 3, label_zh: 可完整配置}
  - {id: RESULT_VISIBLE, rank: 4, label_zh: 结果可视}
  - {id: NATIVE_QUALIFIED, rank: 5, label_zh: 原生资格通过}
